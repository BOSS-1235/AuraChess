<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141316" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />
    <title>AuraChess — Play, study, and improve</title>
    <meta name="description" content="A calm, fast home for chess: play instantly against a local engine, study with an AI tutor, and track your rating against friends." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!--
      Applying the saved theme before React mounts avoids a flash of the
      wrong theme on load.
    -->
    <script>
      (function () {
        var saved = localStorage.getItem('aurachess-theme')
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
